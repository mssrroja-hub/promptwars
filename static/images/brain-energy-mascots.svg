<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180" fill="none">
  <defs>
    <!-- Brain Gradients -->
    <linearGradient id="brainPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8C5"/>
      <stop offset="50%" stop-color="#FF7FA3"/>
      <stop offset="100%" stop-color="#F45A85"/>
    </linearGradient>
    <linearGradient id="brainShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63968"/>
      <stop offset="100%" stop-color="#BA1B49"/>
    </linearGradient>
    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Sparkles & Floating Stars -->
  <g opacity="0.9">
    <!-- Star 1 -->
    <path d="M40 30 Q40 45 25 45 Q40 45 40 60 Q40 45 55 45 Q40 45 40 30 Z" fill="#FBBF24" opacity="0.85"/>
    <!-- Star 2 -->
    <path d="M300 20 Q300 32 288 32 Q300 32 300 44 Q300 32 312 32 Q300 32 300 20 Z" fill="#8B5CF6" opacity="0.75"/>
    <!-- Star 3 -->
    <path d="M165 15 Q165 24 156 24 Q165 24 165 33 Q165 24 174 24 Q165 24 165 15 Z" fill="#38BDF8" opacity="0.8"/>
    <!-- Small sparkles -->
    <circle cx="85" cy="18" r="3" fill="#EC4899" opacity="0.7"/>
    <circle cx="260" cy="40" r="3.5" fill="#FBBF24" opacity="0.8"/>
    <circle cx="140" cy="48" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  </g>

  <!-- Lightbulb Float (Ideas/Intelligence) -->
  <g transform="translate(20, 75) scale(0.85)">
    <circle cx="16" cy="16" r="14" fill="#FEF08A" opacity="0.9"/>
    <path d="M11 26 H21 V30 H11 Z" fill="#94A3B8"/>
    <path d="M12 10 Q16 4 20 10 Q16 16 16 22" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="16" r="18" fill="#FDE047" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- =====================================================================
       CUTE PINK CARTOON BRAIN CHARACTER
       ===================================================================== -->
  <g transform="translate(70, 20)">
    <!-- Brain Glow -->
    <ellipse cx="65" cy="75" rx="58" ry="48" fill="#FFE0ED" opacity="0.5" filter="url(#glow)"/>

    <!-- Left Lobe Clusters -->
    <path d="M 40 45 
             C 20 40, 10 60, 20 80
             C 10 95, 25 118, 48 116
             C 55 120, 68 118, 70 110
             C 70 70, 65 50, 40 45 Z" fill="url(#brainPink)"/>

    <!-- Right Lobe Clusters -->
    <path d="M 70 45 
             C 95 40, 110 60, 102 80
             C 112 95, 98 118, 74 116
             C 68 120, 56 118, 54 110
             C 55 70, 60 50, 70 45 Z" fill="url(#brainPink)"/>

    <!-- Top Lobes -->
    <circle cx="42" cy="48" r="22" fill="url(#brainPink)"/>
    <circle cx="78" cy="48" r="22" fill="url(#brainPink)"/>
    <circle cx="60" cy="40" r="18" fill="url(#brainPink)"/>

    <!-- Brain Curvature Lines / Sulci -->
    <path d="M 32 50 Q 42 62 36 78" stroke="#E63968" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 88 50 Q 78 62 84 78" stroke="#E63968" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 60 44 V 68" stroke="#E63968" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cute Eyes -->
    <!-- Left Eye -->
    <ellipse cx="44" cy="74" rx="6.5" ry="8" fill="#24245E"/>
    <circle cx="42" cy="71" r="2.8" fill="#FFFFFF"/>
    <circle cx="46" cy="76" r="1.4" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="76" cy="74" rx="6.5" ry="8" fill="#24245E"/>
    <circle cx="74" cy="71" r="2.8" fill="#FFFFFF"/>
    <circle cx="78" cy="76" r="1.4" fill="#FFFFFF"/>

    <!-- Blushing Pink Cheeks -->
    <ellipse cx="34" cy="83" rx="7" ry="4.5" fill="#FF4D79" opacity="0.45"/>
    <ellipse cx="86" cy="83" rx="7" ry="4.5" fill="#FF4D79" opacity="0.45"/>

    <!-- Happy Smiling Mouth with Tiny Tongue -->
    <path d="M 52 82 Q 60 92 68 82" stroke="#24245E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 55 84 Q 60 90 65 84 Z" fill="#FF6B8B"/>

    <!-- Little Sparkle on Brain Head -->
    <path d="M 60 18 Q 60 25 53 25 Q 60 25 60 32 Q 60 25 67 25 Q 60 25 60 18 Z" fill="#FFE0ED"/>
  </g>

  <!-- Connection Spark / Heart -->
  <g transform="translate(182, 60)">
    <path d="M 12 6 A 4 4 0 0 0 4 10 C 4 15 12 21 12 21 C 12 21 20 15 20 10 A 4 4 0 0 0 12 6 Z" fill="#EC4899"/>
    <circle cx="12" cy="28" r="2" fill="#FBBF24"/>
    <circle cx="16" cy="34" r="1.5" fill="#8B5CF6"/>
  </g>

  <!-- =====================================================================
       GLOWING YELLOW LIGHTNING BOLT / ENERGY CHARACTER
       ===================================================================== -->
  <g transform="translate(205, 18)">
    <!-- Bolt Outer Glow -->
    <path d="M 52 14 L 18 78 L 46 78 L 30 138 L 84 62 L 54 62 Z" fill="#FEF08A" opacity="0.4" filter="url(#glow)"/>

    <!-- Bolt Body -->
    <path d="M 50 16 L 22 74 L 48 74 L 34 132 L 82 60 L 52 60 Z" 
          fill="url(#boltGrad)" 
          stroke="#F59E0B" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Energy Bolt Face -->
    <!-- Eyes -->
    <ellipse cx="44" cy="58" rx="4.5" ry="5.5" fill="#24245E"/>
    <circle cx="43" cy="56" r="1.8" fill="#FFFFFF"/>
    <!-- Wink Eye -->
    <path d="M 58 58 Q 63 53 67 58" stroke="#24245E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Blushing Cheeks -->
    <circle cx="38" cy="65" r="3.5" fill="#F97316" opacity="0.4"/>
    <circle cx="70" cy="64" r="3.5" fill="#F97316" opacity="0.4"/>

    <!-- Cute Grin -->
    <path d="M 48 66 Q 55 73 62 66" stroke="#24245E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Energy Aura Dots -->
    <circle cx="86" cy="46" r="3" fill="#FDE047"/>
    <circle cx="14" cy="80" r="2.5" fill="#FDE047"/>
    <circle cx="42" cy="140" r="2" fill="#F59E0B"/>
  </g>
</svg>
